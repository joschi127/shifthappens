<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ShiftHappens Icon">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8dff"/>
      <stop offset="55%" stop-color="#3880ff"/>
      <stop offset="100%" stop-color="#6a4bff"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
  </defs>

  <!-- App-Badge mit weichem Verlauf (full-bleed, passend zur Home-Logo-Optik) -->
  <rect width="512" height="512" rx="100" fill="url(#badgeGrad)"/>

  <!-- Kreisende Shift-Pfeile (der humorvolle "es verschiebt sich"-Twist) -->
  <g stroke="#ffd34e" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M256 87 A169 169 0 0 1 425 256"/>
    <path d="M425 256 L410 210 M425 256 L458 230"/>
    <path d="M256 425 A169 169 0 0 1 87 256"/>
    <path d="M87 256 L102 302 M87 256 L54 282"/>
  </g>

  <!-- Uhr-/Charakter-Gesicht -->
  <circle cx="256" cy="256" r="138" fill="url(#faceGrad)" stroke="#1a1a1a" stroke-width="13"/>

  <!-- Cartoon-Augen -->
  <circle cx="205" cy="225" r="20" fill="#1a1a1a"/>
  <circle cx="210" cy="218" r="7" fill="#ffffff"/>
  <circle cx="307" cy="225" r="20" fill="#1a1a1a"/>
  <circle cx="312" cy="218" r="7" fill="#ffffff"/>

  <!-- Breites Grinsen -->
  <path d="M200 287 q56 61 113 0" fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>

  <!-- Uhrzeiger -->
  <g stroke="#3880ff" stroke-linecap="round" fill="none">
    <line x1="256" y1="256" x2="256" y2="169" stroke-width="10"/>
    <line x1="256" y1="256" x2="312" y2="256" stroke-width="13"/>
    <circle cx="256" cy="256" r="13" fill="#3880ff" stroke="none"/>
  </g>
</svg>
